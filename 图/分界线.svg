<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="520" viewBox="0 0 1300 520" font-family="'PingFang SC','Microsoft YaHei','Noto Sans CJK SC','Helvetica Neue',Arial,sans-serif"><title>分界线 什么归系统 什么归编排</title><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#888"/></marker></defs><rect width="1300" height="520" fill="#ffffff"/><text x="24" y="40" font-size="22" fill="#1f2328" font-weight="bold" text-anchor="start">分界线：什么归系统，什么归编排</text><text x="24" y="66" font-size="14" fill="#6b7280" font-weight="normal" text-anchor="start">出了错后果严重的，系统兜住；只影响好不好用的，交给编排</text><rect x="24" y="88" width="1252" height="180" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.2"/><rect x="40" y="104" width="150" height="148" rx="8" fill="#ffffff" stroke="#fdba74" stroke-width="1.2"/><text x="115" y="166.0" font-size="18" fill="#1f2328" font-weight="bold" text-anchor="middle">系统兜底</text><text x="115" y="190.0" font-size="13" fill="#6b7280" font-weight="normal" text-anchor="middle">研发实现</text><text x="115" y="210.0" font-size="13" fill="#6b7280" font-weight="normal" text-anchor="middle">系统强制</text><text x="210" y="124" font-size="15" fill="#1f2328" font-weight="bold" text-anchor="start">涉及资金变动、操作权限、数据可见范围的</text><text x="509.0" y="124" font-size="13" fill="#6b7280" font-weight="normal" text-anchor="start">AI 怎么理解错，都绕不过去</text><rect x="210.0" y="140" width="340.6666666666667" height="112" rx="7" fill="#ffffff" stroke="#fdba74" stroke-width="1.2"/><text x="222.0" y="164.0" font-size="14" fill="#1f2328" font-weight="bold" text-anchor="start">资金变动</text><text x="222.0" y="186.3" font-size="12.5" fill="#374151" font-weight="normal" text-anchor="start">必填、取值合不合法、日期能不能选、有没有超限额、单</text><text x="222.0" y="204.425" font-size="12.5" fill="#374151" font-weight="normal" text-anchor="start">据和收款人的状态；确认卡和操作授权</text><rect x="564.6666666666667" y="140" width="340.6666666666667" height="112" rx="7" fill="#ffffff" stroke="#fdba74" stroke-width="1.2"/><text x="576.6666666666667" y="164.0" font-size="14" fill="#1f2328" font-weight="bold" text-anchor="start">操作权限</text><text x="576.6666666666667" y="186.3" font-size="12.5" fill="#374151" font-weight="normal" text-anchor="start">用户自己做不了的，AI 也做不了</text><rect x="919.3333333333334" y="140" width="340.6666666666667" height="112" rx="7" fill="#ffffff" stroke="#fdba74" stroke-width="1.2"/><text x="931.3333333333334" y="164.0" font-size="14" fill="#1f2328" font-weight="bold" text-anchor="start">数据可见范围</text><text x="931.3333333333334" y="186.3" font-size="12.5" fill="#374151" font-weight="normal" text-anchor="start">页面上看不到的数据，交给 AI 之前就去掉，如成本价、</text><text x="931.3333333333334" y="204.425" font-size="12.5" fill="#374151" font-weight="normal" text-anchor="start">内部备注</text><line x1="24" y1="296" x2="1276" y2="296" stroke="#ef4444" stroke-width="2.2" stroke-dasharray="10 6"/><rect x="600.0" y="284" width="100" height="24" rx="12" fill="#ffffff" stroke="#ef4444" stroke-width="1.2"/><text x="650.0" y="301" font-size="13" fill="#b91c1c" font-weight="bold" text-anchor="middle">分界线</text><line x1="1140" y1="330" x2="1140" y2="276" stroke="#ef4444" stroke-width="1.8" marker-end="url(#arr)"/><text x="1150" y="322" font-size="12" fill="#b91c1c" font-weight="normal" text-anchor="start">编排写得再差，也绕不过</text><rect x="24" y="330" width="1252" height="170" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1.2"/><rect x="40" y="346" width="150" height="138" rx="8" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/><text x="115" y="403.0" font-size="18" fill="#1f2328" font-weight="bold" text-anchor="middle">编排</text><text x="115" y="427.0" font-size="13" fill="#6b7280" font-weight="normal" text-anchor="middle">产品主写</text><text x="115" y="447.0" font-size="13" fill="#6b7280" font-weight="normal" text-anchor="middle">提示词、工具说明</text><text x="210" y="366" font-size="15" fill="#1f2328" font-weight="bold" text-anchor="start">只影响好不好用的</text><text x="344.0" y="366" font-size="13" fill="#6b7280" font-weight="normal" text-anchor="start">改错了也不会引起资金变动（前提是上面的规则在系统里）；改得勤，不等发版</text><rect x="210.0" y="382" width="340.6666666666667" height="102" rx="7" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/><text x="222.0" y="406.0" font-size="14" fill="#1f2328" font-weight="bold" text-anchor="start">先问什么、后问什么</text><text x="222.0" y="428.3" font-size="12.5" fill="#374151" font-weight="normal" text-anchor="start">一次问全还是分几轮；什么时候调哪个工具</text><rect x="564.6666666666667" y="382" width="340.6666666666667" height="102" rx="7" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/><text x="576.6666666666667" y="406.0" font-size="14" fill="#1f2328" font-weight="bold" text-anchor="start">话怎么说</text><text x="576.6666666666667" y="428.3" font-size="12.5" fill="#374151" font-weight="normal" text-anchor="start">措辞、语气；两端用户的不同说法；说得清不清楚</text><rect x="919.3333333333334" y="382" width="340.6666666666667" height="102" rx="7" fill="#ffffff" stroke="#93c5fd" stroke-width="1.2"/><text x="931.3333333333334" y="406.0" font-size="14" fill="#1f2328" font-weight="bold" text-anchor="start">写得再差，最坏是…</text><text x="931.3333333333334" y="428.3" font-size="12.5" fill="#374151" font-weight="normal" text-anchor="start">AI 问得啰嗦、说得不清楚。想绕过上面的系统规则，绕</text><text x="931.3333333333334" y="446.425" font-size="12.5" fill="#374151" font-weight="normal" text-anchor="start">不过去</text></svg>